schema: "1.0"
name: "LingxiGraph"
description: |
  Enterprise provider-neutral durable graph runtime for multi-agent systems. Primary language: python; ships a container definition; observed outbound integrations: api.openai.com.
category: "DevOps"
license: "mit"
pricing:
  trial:
    days: 14
  model: per_token
  apis:
    - url_pattern: "api.openai.com"
      type: free
      note: "openai -- third-party corpus entry; usage tracked, not billed."
tags:
  - "insygna-census"
  - "devops"
  - "agent-runtime"
  - "fastapi"
  - "graph-runtime"
  - "langgraph"
  - "python"

# The app container: api (it runs the worker embedded, so the compose "scale" profile's separate worker is left out, as plain `docker compose up` does).
resources:
  cpu:
    request: "250m"
    limit: "1"
  memory:
    request: "512Mi"
    limit: "1Gi"

runtime:
  compose_profiles: []
  containers:
    - name: api
      role: app
    - name: migrate
      role: auxiliary
      resources:
        cpu: { request: "100m", limit: "500m" }
        memory: { request: "128Mi", limit: "512Mi" }
    - name: postgres
      role: auxiliary
      resources:
        cpu: { request: "100m", limit: "500m" }
        memory: { request: "256Mi", limit: "512Mi" }
    - name: redis
      role: auxiliary
      resources:
        cpu: { request: "50m", limit: "250m" }
        memory: { request: "64Mi", limit: "256Mi" }
